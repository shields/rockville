name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# prettier-ignore
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make actions-lock-install
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make lint
      - run: make test

  build:
    name: build
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # required to push the container image to GHCR
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # gitcalver needs full history to count commits per date.
          fetch-depth: 0
          persist-credentials: false
      - name: Compute version
        id: version
        run:
          echo "version=$(./scripts/gitcalver.sh --dirty -dev)" >>
          "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Immutable version tags only; no :latest to avoid ambiguity.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push:
            ${{ github.ref == 'refs/heads/main' && github.event_name == 'push'
            }}
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:
            ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
